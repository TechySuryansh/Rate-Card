version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ratecard-db
    environment:
      POSTGRES_DB: ratecard_workflow
      POSTGRES_USER: ratecard
      POSTGRES_PASSWORD: ratecard_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratecard -d ratecard_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
