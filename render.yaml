services:
  - type: web
    name: rate-card-api
    runtime: node
    plan: free
    buildCommand: npm install \u0026\u0026 npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ratecard_workflow
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
