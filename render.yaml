services:
  - type: web
    name: rate-card-ai
    runtime: python
    plan: free
    buildCommand: pip install -r v2_intelligence_pipeline/requirements.txt
    startCommand: streamlit run v2_intelligence_pipeline/app.py --server.port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
